name: Testing
run-name: ${{ github.actor }} is testing 🚀
on: [push]

jobs:
  Explore-GitHub-Actions: 
    runs-on: ubuntu-latest
    steps: 
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test